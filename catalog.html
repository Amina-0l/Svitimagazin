<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Цветочный магазин - каталог</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1><em>Цветочный магазин</em></h1>
        <nav>
            <ul>
                <li><a href="index.html">Главная</a></li>
                <li><a href="catalog.html">Каталог</a></li>
                <li><a href="contacts.html">Контакты</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Каталог букетов</h2>
        <p>Выберите букет по вкусу. Все букеты собраны с любовью.</p>

        <div class="catalog">
            <div class="card">
                <img src="images/im1.png" alt="Букет роз">
                <h3>Букет роз</h3>
                <p class="price">1500 ₽</p>
            </div>

            <div class="card">
                <img src="images/im2.png" alt="Букет тюльпанов">
                <h3>Букет тюльпанов</h3>
                <p class="price">1200 ₽</p>
            </div>

            <div class="card">
                <img src="images/im3.png" alt="Букет пионов">
                <h3>Букет пионов</h3>
                <p class="price">1800 ₽</p>
            </div>

            <div class="card">
                <img src="images/im4.png" alt="Букет ромашек">
                <h3>Букет ромашек</h3>
                <p class="price">900 ₽</p>
            </div>
        </div>

        <p><a href="contacts.html">Как заказать? →</a></p>
    </main>

    <footer>
        <p><em>Цветочный магазин</em></p>
    </footer>
</body>
</html>
